<div class="call-service-container" role="main" aria-label="SIAB - Servicio de Llamadas">
  <p-toast></p-toast>

  <!-- Toolbar -->
  <app-toolbar
    (executeQuery)="onExecuteQuery()"
    (save)="onSave()"
    (exit)="onExit()"
    (navigateFirst)="onNavigateFirst()"
    (navigatePrevious)="onNavigatePrevious()"
    (navigateNext)="onNavigateNext()"
    (navigateLast)="onNavigateLast()"
    (print)="onPrint()"
    (help)="onHelp()"
    (createInexistentUser)="onCreateInexistentUser()"
    (evaluations)="onEvaluations()"
    (causeCharacteristics)="onCauseCharacteristics()"
    role="toolbar"
    aria-label="Barra de herramientas principal">
  </app-toolbar>

  <!-- Tab View -->
  <p-tabView #tabView
    [(activeIndex)]="activeTabIndex"
    (onChange)="onTabChange($event)"
    [scrollable]="true"
    role="tablist">

    <!-- Tab 1: Llamada -->
    <p-tabPanel header="Llamada" leftIcon="pi pi-phone">
      <ng-template pTemplate="content">
        <app-llamada-form #llamadaForm
          (caseSaved)="onCaseSaved($event)"
          (caseLoaded)="onCaseLoaded($event)">
        </app-llamada-form>
      </ng-template>
    </p-tabPanel>

    <!-- Tab 2: Servicios a Prestar -->
    <p-tabPanel header="Servicios a Prestar" leftIcon="pi pi-cog"
      [disabled]="!currentCaso?.numero">
      <ng-template pTemplate="content">
        <app-servicio-list #servicioList></app-servicio-list>
      </ng-template>
    </p-tabPanel>

    <!-- Tab 3: Características -->
    <p-tabPanel header="Características" leftIcon="pi pi-list"
      [disabled]="!currentCaso?.numero">
      <ng-template pTemplate="content">
        <app-causa-characteristics></app-causa-characteristics>
      </ng-template>
    </p-tabPanel>

    <!-- Tab 4: Recurso Confiable -->
    <p-tabPanel header="Recurso Confiable" leftIcon="pi pi-shield"
      [disabled]="!currentCaso?.numero">
      <ng-template pTemplate="content">
        <app-recurso-confiable></app-recurso-confiable>
      </ng-template>
    </p-tabPanel>

    <!-- Tab 5: Información Servicio -->
    <p-tabPanel header="Información Servicio" leftIcon="pi pi-info-circle"
      [disabled]="!currentCaso?.numero">
      <ng-template pTemplate="content">
        <app-informacion-servicio></app-informacion-servicio>
      </ng-template>
    </p-tabPanel>
  </p-tabView>

  <!-- Diálogo de consulta por número de caso -->
  <p-dialog header="Consultar Caso" [(visible)]="showQueryDialog" [modal]="true"
    [style]="{width: '400px'}" [closable]="true">
    <div class="flex flex-column gap-3 pt-3">
      <label class="font-bold">Número de caso / llamada:</label>
      <input pInputText [(ngModel)]="queryNumero" (keydown.enter)="onQuerySubmit()"
        placeholder="Ingrese el número" autofocus class="w-full" />
    </div>
    <ng-template pTemplate="footer">
      <p-button label="Consultar" icon="pi pi-search" (onClick)="onQuerySubmit()"></p-button>
      <p-button label="Cancelar" icon="pi pi-times" (onClick)="showQueryDialog = false"
        severity="secondary"></p-button>
    </ng-template>
  </p-dialog>
</div>
