<div class="causa-characteristics" role="form" aria-label="Características de la causa">
  <p-table [value]="caracteristicas" [rows]="20" [paginator]="true" role="grid" aria-label="Tabla de características">
    <ng-template pTemplate="header">
      <tr><th>Campo</th><th>Tipo</th><th>Valor</th><th>Requerido</th></tr>
    </ng-template>
    <ng-template pTemplate="body" let-car let-i="rowIndex">
      <tr>
        <td>{{car.dspCampo}}</td>
        <td>{{car.dspTipoDato}}</td>
        <td>
          <input pInputText [(ngModel)]="car.valor" [tabindex]="20 + i"
            [readonly]="car.campoNoModificable === 'S'"
            [attr.aria-label]="car.dspCampo"
            [attr.aria-required]="car.requerido === 'S'">
        </td>
        <td><span *ngIf="car.requerido === 'S'" class="text-red-500">*</span></td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage"><tr><td colspan="4">No hay características configuradas</td></tr></ng-template>
  </p-table>
  <div class="mt-3">
    <button pButton label="Guardar" icon="pi pi-save" (click)="onSave()" aria-label="Guardar características"></button>
  </div>
</div>
